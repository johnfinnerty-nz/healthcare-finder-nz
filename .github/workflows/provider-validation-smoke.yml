name: Provider validation deployment smoke test

on:
  push:
    branches: [main]
    paths:
      - providers.json
      - data/provider-validation/**

permissions:
  contents: write
  pull-requests: write

jobs:
  smoke:
    if: ${{ startsWith(github.event.head_commit.message, 'chore(provider-data): autonomous validation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out published commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run post-merge recommendation and data checks
        id: local
        continue-on-error: true
        run: |
          npm run check:syntax
          npm run validate:data
          npm test

      - name: Wait for GitHub Pages and run public smoke checks
        id: pages
        continue-on-error: true
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            HOME_STATUS=$(curl --silent --show-error --output /tmp/home.html --write-out "%{http_code}" "https://johnfinnerty-nz.github.io/healthcare-finder-nz/")
            DATA_STATUS=$(curl --silent --show-error --output /tmp/providers.json --write-out "%{http_code}" "https://johnfinnerty-nz.github.io/healthcare-finder-nz/providers.json")
            if [ "$HOME_STATUS" = "200" ] && [ "$DATA_STATUS" = "200" ] && grep -q "Care Finder Aotearoa" /tmp/home.html && node -e "const p=require('/tmp/providers.json'); if(!Array.isArray(p)||!p.length) process.exit(1)"; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Create automatic rollback pull request
        if: ${{ steps.local.outcome == 'failure' || steps.pages.outcome == 'failure' }}
        shell: bash
        run: |
          FAILED_SHA="${{ github.sha }}"
          BRANCH="automation/revert-provider-validation-${{ github.run_id }}"
          git config user.name "provider-validation-bot"
          git config user.email "provider-validation-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git revert --no-edit "$FAILED_SHA"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Revert failed provider validation ${FAILED_SHA:0:8}" --body "Automated rollback: post-deployment recommendation, data, or public-site smoke checks failed. This restores the previous provider projection while the failed run is investigated.")
          gh pr merge "$PR_URL" --auto --squash
